# Runtime messages (errors returned by the service), English.
# Translations go into messages_<language>.properties, e.g. messages_de.properties.
# Placeholders: for @assert.range {0} = entered value, {1} = min, {2} = max.

# Overrides for CAP's built-in messages
ASSERT_TARGET = The selected record doesn''t exist. It may have been deleted.

# Schema checks (@assert.format / @assert.range in db/schema.cds)
EMAIL_INVALID = Enter a valid email address, e.g. name@example.com
PHONE_INVALID = Enter a phone number using digits, spaces, ( ) and -, optionally starting with +
VIN_INVALID = A VIN has exactly 17 characters: digits and capital letters except I, O and Q
MILEAGE_NEGATIVE = Mileage cannot be negative
SERVICE_INTERVAL_RANGE = Enter a service interval between {1} and {2} months
HOURLY_RATE_NOT_POSITIVE = The hourly rate must be greater than 0
PRICE_NEGATIVE = The price cannot be negative
STOCK_NEGATIVE = Stock cannot be negative
MIN_STOCK_NEGATIVE = Minimum stock cannot be negative

# Service checks (srv/workshop-service.js)
# - general
ALREADY_IN_USE = {0} "{1}" is already in use
STILL_IN_USE = Cannot delete: still used in {0}.
STILL_IN_USE_DEACTIVATE = Cannot delete: still used in {0}. Set it inactive instead.
YEAR_OUT_OF_RANGE = Enter a year between {0} and {1}
LAST_SERVICE_IN_FUTURE = The last service date can''t be in the future

# - service orders ({0} = current status, {1} = action name)
ORDER_NOT_FOUND = Service order not found
ORDER_NOT_EDITABLE = Cannot update an order in status {0}
ORDER_NOT_DELETABLE = Cannot delete an order in status {0}
ORDER_ITEMS_LOCKED = Cannot change items of an order in status {0}
ORDER_ACTION_NOT_ALLOWED = Cannot {1} an order in status {0}
VEHICLE_LOCKED = The vehicle can''t be changed on an order in status {0}. Cancel the order and create a new one instead.
ORDER_NUMBERS_EXHAUSTED = Order number limit for {0}* reached
ORDER_DATE_IN_FUTURE = The order date can''t be in the future
ORDER_HAS_NO_ITEMS = Add at least one item before completing the order
START_NEEDS_MECHANIC = Assign a mechanic before starting the order
MECHANIC_STILL_NEEDED = Cannot remove the mechanic from a started order or one with labor items
MECHANIC_INACTIVE = {0} is inactive and can''t be assigned to orders
MECHANIC_HAS_OPEN_ORDERS = This mechanic still has {0} open or in-progress order(s). Reassign or finish them first.
NOT_ENOUGH_STOCK = Not enough stock for {0} ({1}): {2} left, {3} needed
MILEAGE_BELOW_RECORDED = Mileage at intake ({0} km) is lower than the vehicle''s recorded mileage ({1} km)

# - order items
QUANTITY_NOT_POSITIVE = Quantity must be greater than 0
PART_REQUIRED = Select a part for a part item
PART_WHOLE_PIECES = Parts can only be used in whole pieces
PART_NOT_FOUND = Part not found
LABOR_WITH_PART = Labor items cannot reference a part
LABOR_NEEDS_MECHANIC = Assign a mechanic to the order before adding labor
MECHANIC_NOT_FOUND = Mechanic not found
UNKNOWN_ITEM_TYPE = Unknown item type {0}
ITEM_WITHOUT_PART = Item "{0}" has no part assigned
